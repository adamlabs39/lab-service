stages:
  - build-deploy

build-deploy:
  stage: build-deploy
  tags:
    - development
  before_script:
    - echo "@adameds:registry=https://gitlab.com/api/v4/groups/93029767/-/packages/npm/" >> .npmrc
    - echo "//gitlab.com/api/v4/groups/93029767/-/packages/npm/:_authToken=$AUTH_TOKEN" >> .npmrc
    - docker compose --env-file /home/env/.env.lab down --rmi all
  only:
    - dev-deployment
  script:
    - docker compose --env-file /home/env/.env.lab up -d

build-prod:
  stage: build-deploy
  tags:
    - production
  before_script:
    - echo "@adameds:registry=https://gitlab.com/api/v4/groups/93029767/-/packages/npm/" >> .npmrc
    - echo "//gitlab.com/api/v4/groups/93029767/-/packages/npm/:_authToken=$AUTH_TOKEN" >> .npmrc
    - docker compose -f prod-compose.yml --env-file /home/gitlab-runner/adameds/.env.lab down --rmi all
  only:
    - prod-deployment
  script:
    - docker compose -f prod-compose.yml --env-file /home/gitlab-runner/adameds/.env.lab up -d
